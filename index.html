<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mark Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 8px;
            display: none;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Mark Calculator</h2>

    <label>Student Name</label>
    <input type="text" id="name" placeholder="Enter student name">

    <label>Register Number</label>
    <input type="text" id="regno" placeholder="Enter register number">

    <label>Subject 1 Mark</label>
    <input type="number" id="sub1" min="0" max="100">

    <label>Subject 2 Mark</label>
    <input type="number" id="sub2" min="0" max="100">

    <label>Subject 3 Mark</label>
    <input type="number" id="sub3" min="0" max="100">

    <label>Subject 4 Mark</label>
    <input type="number" id="sub4" min="0" max="100">

    <label>Subject 5 Mark</label>
    <input type="number" id="sub5" min="0" max="100">

    <button onclick="calculateMarks()">Calculate Result</button>

    <div id="result">
        <h3>Student Result</h3>
        <p><strong>Name:</strong> <span id="resultName"></span></p>
        <p><strong>Register No:</strong> <span id="resultRegno"></span></p>
        <p><strong>Total Marks:</strong> <span id="total"></span> / 500</p>
        <p><strong>Average:</strong> <span id="average"></span>%</p>
        <p><strong>Grade:</strong> <span id="grade"></span></p>
        <p><strong>Result:</strong> <span id="status"></span></p>
    </div>

</div>

<script>
function calculateMarks() {

    let name = document.getElementById("name").value;
    let regno = document.getElementById("regno").value;

    let marks = [
        Number(document.getElementById("sub1").value),
        Number(document.getElementById("sub2").value),
        Number(document.getElementById("sub3").value),
        Number(document.getElementById("sub4").value),
        Number(document.getElementById("sub5").value)
    ];

    // Check student details
    if (name === "" || regno === "") {
        alert("Please enter Name and Register Number");
        return;
    }

    // Check all marks
    if (marks.some(mark => mark < 0 || mark > 100 || isNaN(mark))) {
        alert("Please enter valid marks between 0 and 100 for all subjects");
        return;
    }

    let total = marks.reduce((sum, mark) => sum + mark, 0);
    let average = total / 5;

    // Grade calculation
    let grade;

    if (average >= 90) {
        grade = "A+";
    } else if (average >= 80) {
        grade = "A";
    } else if (average >= 70) {
        grade = "B";
    } else if (average >= 60) {
        grade = "C";
    } else if (average >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    // Pass if every subject is 35 or above
    let passed = marks.every(mark => mark >= 35);

    document.getElementById("resultName").innerText = name;
    document.getElementById("resultRegno").innerText = regno;
    document.getElementById("total").innerText = total;
    document.getElementById("average").innerText = average.toFixed(2);
    document.getElementById("grade").innerText = grade;

    let status = document.getElementById("status");

    if (passed) {
        status.innerText = "PASS";
        status.className = "pass";
    } else {
        status.innerText = "FAIL";
        status.className = "fail";
    }

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
